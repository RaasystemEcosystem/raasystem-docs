<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raasystem Backend API</title>
  <link rel="stylesheet" href="./swagger-assets/swagger-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1f2937;
      color: #ffffff;
      padding: 1rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 0.3rem 0 0 0; font-size: 1rem; color: #cbd5e1; }
    .server-controls {
      margin-top: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .server-controls button, .server-controls select {
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .server-controls button { background-color: #3b82f6; color: #fff; }
    .server-controls button:hover { background-color: #2563eb; }
    .server-controls select { background-color: #ffffff; color: #000; }
    #swagger-ui { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Raasystem Backend API</h1>
    <p>Unified API powering RaasBridge, Raaspay, Raaswallet, RBT, and the Full Market Data Suite.</p>
    <div class="server-controls">
      <span>Select Server:</span>
      <select id="server-selector"></select>
      <button id="copy-server">Copy URL</button>
      <button id="open-server">Open in Browser</button>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="./swagger-assets/swagger-ui-bundle.js"></script>
  <script src="./swagger-assets/swagger-ui-standalone-preset.js"></script>
  <script>
    let swaggerUIInstance;

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => alert(`Copied URL to clipboard: ${text}`));
    }

    function openInBrowser(url) {
      window.open(url, '_blank');
    }

    function initSwagger(serverUrl) {
      if (swaggerUIInstance) swaggerUIInstance.destroy();
      swaggerUIInstance = SwaggerUIBundle({
        url: 'swagger.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        docExpansion: "none",
        defaultModelRendering: "example",
        showExtensions: true,
        showCommonExtensions: true,
        requestInterceptor: req => {
          req.url = req.url.replace(/^http:\/\/localhost:8000/, serverUrl);
          return req;
        }
      });
      window.ui = swaggerUIInstance;
    }

    function isPrivateIP(ip) {
      return /^192\.168\.\d{1,3}\.\d{1,3}$/.test(ip) ||
             /^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(ip) ||
             /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/.test(ip);
    }

    function detectLocalIPs(callback) {
      const RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
      if (!RTCPeerConnection) return;

      const ips = new Set();
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel("");
      pc.createOffer().then(offer => pc.setLocalDescription(offer));
      pc.onicecandidate = function(event) {
        if (!event || !event.candidate) return;
        const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(event.candidate.candidate);
        if (ipMatch) {
          const ip = ipMatch[1];
          if (isPrivateIP(ip) && !ips.has(ip)) {
            ips.add(ip);
            callback(ip);
          }
        }
      };
    }

    const selector = document.getElementById('server-selector');
    const defaultServers = ['127.0.0.1:8080', 'localhost:8080'];

    // Add default servers
    defaultServers.forEach(addr => {
      const option = document.createElement('option');
      option.value = `http://${addr}`;
      option.textContent = addr;
      selector.appendChild(option);
    });

    // Initialize Swagger with the first default server
    initSwagger(selector.value);

    // Detect local network IPs dynamically
    detectLocalIPs(ip => {
      const option = document.createElement('option');
      option.value = `http://${ip}:8080`;
      option.textContent = `${ip}:8080`;
      selector.appendChild(option);
      selector.value = `http://${ip}:8080`;
      initSwagger(selector.value);
    });

    // Event listeners
    selector.addEventListener('change', e => initSwagger(e.target.value));
    document.getElementById('copy-server').addEventListener('click', () => copyToClipboard(selector.value));
    document.getElementById('open-server').addEventListener('click', () => openInBrowser(selector.value));
  </script>
</body>
</html>
